<!doctype html><html><head><title>Render fixture only</title></head><body style="margin:0;background:#0c1834"><canvas id="c" style="width:100vw;height:100vh;display:block" width="1920" height="1080"></canvas><script>const x=c.getContext('2d');window.ready=Promise.resolve();window.seek=t=>{x.fillStyle='#0c1834';x.fillRect(0,0,1920,1080);x.fillStyle='#dcb65e';x.fillRect(160,300,300+Math.round(t*200),120);x.fillStyle='#fff';x.font='60px sans-serif';x.fillText('RENDER FIXTURE',160,200)};seek(0);</script></body></html>
