[workspace]
resolver = "2"
members = [
    "libs/relax/lex",
    "libs/relax/session",
    "libs/relax/base",
    "libs/relax/front",
    "libs/relax/types",
    "libs/relax/codegen",
    "libs/relax/backend",
    "libs/relax/compiler",
    "libs/relax/native_macros",
    "libs/relax_api",
    "libs/relax_api/macro",
    "libs/relax_api/macro_impl",
    "libs/relax_api/phase",
    "tools/run/runner",
]
exclude = [
    "libs/relax/compiler/std",
    "libs/relax/compiler/tests",
    "libs/relax/types/tests",
    "libs/relax/attr",
    "libs/windows/sys",
    "libs/micro_serde/example",
]

[workspace.dependencies]
makepad-cpu-budget = { path = "libs/cpu_budget", version = "1.0.0" }
relax-lex = { path = "libs/relax/lex", version = "0.1.0" }
relax-base = { path = "libs/relax/base", version = "0.1.0" }
relax-backend = { path = "libs/relax/backend", version = "0.1.0" }
relax-codegen = { path = "libs/relax/codegen", version = "0.1.0" }
relax-compiler = { path = "libs/relax/compiler", version = "0.1.0" }
relax-front = { path = "libs/relax/front", version = "0.1.0" }
relax-light-http = { path = "tools/run/light_http", version = "0.1.0" }
relax-native-macros = { path = "libs/relax/native_macros", version = "0.1.0" }
relax-session = { path = "libs/relax/session", version = "0.1.0" }
relax-types = { path = "libs/relax/types", version = "0.1.0" }
makepad-remote = { path = "libs/remote", version = "0.1.0" }
makepad-strict-json = { path = "libs/strict_json", version = "0.1.0" }
makepad-gpu-trace = { path = "libs/gpu_trace", version = "1.0.0" }
makepad-prof-stream = { path = "libs/prof_stream", version = "1.0.0" }
relax-api = { path = "libs/relax_api", version = "1.0.0" }
relax-api-macro-impl = { path = "libs/relax_api/macro_impl", version = "1.0.0" }
makepad-live-id-macros-impl = { path = "libs/live_id/id_macros_impl", version = "1.0.0" }
makepad-micro-serde-derive-impl = { path = "libs/micro_serde/derive_impl", version = "1.0.0" }
makepad-micro-proc-macro = { path = "libs/micro_proc_macro", version = "1.0.0" }

[profile.dev]
debug = "line-tables-only"

# release: agents build release all the time, so an edited crate recompiles
# incrementally (widgets edit 30 s -> 11 s on Mac, 45 s -> 16 s on Windows;
# a clean build is ~6% slower). cargo-makepad's packaging commands (android,
# apple, wasm, desktop build) set CARGO_PROFILE_RELEASE_INCREMENTAL=false,
# so shipped binaries are still built whole. lto = "off" drops the default
# thin-local LTO pass (release clean 63 s -> 52 s for amp, edit loop faster).
[profile.release]
incremental = true
lto = "off"

# host: the `makepad` JIT binary (Relax + makepad run) built for speed on the machine that runs it.
# Output goes to target/host/ (or target/<triple>/host/), never over target/release: release stays the
# distributable build and the build every gate, A/B and timing series uses.
# local/agent_state/relax-campaign/build-host.sh adds -Ctarget-cpu=native and the PGO profile.
# lto = false: LTO within each crate, no whole-program link step. On a 16-core Linux box (2026-11-05,
# against thin LTO) a relax-compiler edit rebuilds in 33 s instead of 59 s, a relax-types edit in 47 s
# instead of 70 s, a tools/run edit in 3 s instead of 39 s and a clean build in 73 s instead of 87 s;
# the JIT compiles about 1.5% slower (selftest CPU 61.5 s -> 62.5 s), settles the same.
[profile.release.package.relax-compiler]
incremental = false
[profile.release.package.relax-types]
incremental = false
[profile.release.package.relax-front]
incremental = false
[profile.release.package.relax-base]
incremental = false
[profile.release.package.relax-codegen]
incremental = false
[profile.release.package.relax-session]
incremental = false
[profile.release.package.relax-native-macros]
incremental = false
