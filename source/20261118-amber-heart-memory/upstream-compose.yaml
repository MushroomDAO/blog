# Amber Heart：记忆网关 + Postgres，可选内置 Caddy 自动 HTTPS。
# 首次安装和升级都运行 ./install.sh；它会生成 .env 并按顺序执行下面的服务。
name: amber-heart
services:
  db:
    image: pgvector/pgvector:0.8.0-pg17@sha256:40b404964359299eefdd5f8518facf1886c562848cf4de13b6eaf91cb70c2b87
    mem_limit: ${MEMORY_DB_MEM_LIMIT:-256m}
    cpus: 1
    restart: unless-stopped
    environment:
      POSTGRES_DB: amber_heart
      POSTGRES_PASSWORD: ${MEMORY_DB_ADMIN_PASSWORD:?先运行 ./install.sh 生成 .env}
      MEMORY_DB_OWNER_PASSWORD: ${MEMORY_DB_OWNER_PASSWORD:?先运行 ./install.sh 生成 .env}
      MEMORY_DB_APP_PASSWORD: ${MEMORY_DB_APP_PASSWORD:?先运行 ./install.sh 生成 .env}
    volumes:
      - database:/var/lib/postgresql/data
      - ./memory_web/deploy/010-roles.sh:/docker-entrypoint-initdb.d/010-roles.sh:ro
    # 小内存参数：配合默认 256m 上限；服务器更大时可调高 MEMORY_DB_MEM_LIMIT。
    command: [postgres, -c, shared_buffers=32MB, -c, work_mem=2MB, -c, maintenance_work_mem=32MB,
      -c, autovacuum_work_mem=16MB, -c, max_connections=12, -c, max_parallel_workers=0,
      -c, max_parallel_workers_per_gather=0, -c, max_parallel_maintenance_workers=0,
      -c, autovacuum_max_workers=1, -c, wal_buffers=1MB, -c, max_wal_size=128MB,
      -c, min_wal_size=32MB, -c, effective_cache_size=128MB]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d amber_heart"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: memory_web/deploy/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: amber-heart:local
    mem_limit: ${MEMORY_APP_MEM_LIMIT:-512m}
    cpus: 1
    restart: unless-stopped
    env_file: .env
    # 只绑定本机：内置 Caddy 走内部网络访问；自备 nginx 时反代到这个端口。
    ports:
      - "127.0.0.1:${MEMORY_LOCAL_PORT:-18081}:8080"
    volumes:
      - app_state:/var/lib/memory-admin
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8080/login',headers={'Host':os.environ['MEMORY_WEB_ORIGIN'].split('://',1)[1]}); urllib.request.urlopen(r,timeout=2).read(1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

  # 内置 HTTPS：.env 里 COMPOSE_PROFILES=caddy 时启动，自动申请和续期证书。
  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: [caddy]
    mem_limit: 128m
    restart: unless-stopped
    environment:
      MEMORY_DOMAIN: ${MEMORY_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  database:
  app_state:
  caddy_data:
  caddy_config:
