[package]
name = "rust-anything"
version = "1.4.0"
edition = "2024"
description = "Rewrite your app in Rust, one piece at a time, checked against the original's recorded behavior at every step. TypeScript/JavaScript, Python, C, Go, Ruby and Java"
license = "MIT"
readme = "README.md"
rust-version = "1.97"
keywords = ["migration", "rewrite", "ffi", "napi", "pyo3"]
categories = ["command-line-utilities", "development-tools", "wasm"]
repository = "https://github.com/erkamyaman/rust-anything"
homepage = "https://github.com/erkamyaman/rust-anything"
exclude = ["demo/", "npm/", "docs/", ".github/", "scripts/", "tests/fixtures/**/node_modules"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
json5 = "0.4"
oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_ast_visit = "0.158"
oxc_parser = "0.158"
oxc_span = "0.158"
oxc_syntax = "0.158"
regex = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: recorded floats must survive parsing bit for bit.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
toml_edit = "0.22"
tree-sitter = "0.26.13"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
