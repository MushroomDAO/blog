# ── 加分信号 ────────────────────────────────────────────
# 这些不是话题，是「这条线索值不值得深挖」的信号。
# 你的选题指纹是「开源 + 能本地跑 + 有部署路径和成本账」，
# 统计支持：标题里 开源 75 / 模型 53 / 指南 52 / 本地 45 / 完整 36 / 成本 9。
bonus:
  # ── 一手实践信号（第 1 轮反馈新增）──
  # 「属于个人的分析观察和体验，它是有价值的」——但必须挖到具体内容才算数
  一手个人实践: 4.0
  有具体踩坑与解法: 4.5
  定位有差异化: 3.5
  功能边界清晰: 2.5
  有 GitHub 仓库链接: 4.0
  有 HuggingFace 模型链接: 4.0
  明确开源协议: 2.5
  能本地/离线运行: 3.0
  Apple Silicon / Mac 可跑: 2.5
  给了部署步骤: 2.0
  给了硬件或成本数字: 2.5
  有 benchmark / 评测数据: 2.0
  首发或首次开源: 2.0

# ── 否决信号 ────────────────────────────────────────────
# 命中任意一条直接丢弃，不进清单。挡掉小红书上最多的那类噪音。
veto:
  # ── 领域否决（实跑发现的最大噪音源）──
  # 「X for Claude Code」类仓库会全部命中 Claude Code / MCP / Agent Skill 关键词，
  # 但 X 本身可能完全不在射程内。这里挡的是 X，不是 Claude Code。
  - 广告投放 / meta ads / google ads / 效果营销
  - 路由器 / 网络设备 / wifi / keenetic / openwrt
  - App Store 提交 / 应用商店上架流程
  - 电商选品 / 带货 / 直播话术
  - 文案模板 / 海报文案 / 营销话术
  - 报税 / 财务记账 / ERP
  - 简历 / 求职 / 面试题
  # ── 内容类型否决（2026-08-10 第 1 轮反馈提炼）──
  - 标题党：提出问题但不给解法
  - 纯新闻报道 / 融资动态 / 行业观察
  - 增量优化类报道（除非能力是颠覆性的）
  - 泛泛的观点陈述，无具体案例支撑
  - 浅显科普，本站读者认知已覆盖
  - 无 GitHub / HF / 论文任一一手源链接
  # ── 领域与技术栈否决 ──
  - JVM / Java 生态
  - 3D 世界 / 元宇宙 / 空间智能
  - 单卡跑不动的超大模型（普通用户用不上）
  - 纯付费课程 / 训练营招生
  - 无出处的截图搬运
  - 纯个人日常 vlog
  - 已在本站发过的同一仓库
  - 拉群 / 加微信 / 私域引流
  - 纯融资新闻无技术内容

# ── 厂商与来源信任度 ────────────────────────────────────
# 不是技术判断，是「我愿不愿意投入时间验证它」的判断。
# 这一维之前完全没建模，导致我把快手模型判成「存档」而你直接否掉。
vendor_trust:
  快手 / Kwaipilot: -6.0

# ── 阈值 ────────────────────────────────────────────────
# 打分后按这两条线分流。先松后紧：宁可多进清单让你划掉，
# 也不要漏掉。跑一周后按你的实际淘汰率再收紧。
thresholds:
  收进知识库: 12.0      # 存下来当弹药，不一定写
  进每日清单: 20.0      # 值得你花时间看一眼
  建议深挖成文: 30.0    # 直接去 GitHub/HF 拉一手资料

# ── 产出方向 ────────────────────────────────────────────
# 命中不同类型时，延展分析往哪个方向写。对应你说的两类文章。
angles:
  模型类: [部署步骤, 硬件选型与成本估算, 量化与显存实测, 同级别模型对比]
  工具/Skill类: [安装到跑通的完整路径, 适合谁用, 和现有工具的边界, 踩坑点]
  创业/商业类: [创业者怎么用, 适合哪个阶段, 成本结构, 可迁移到哪些行业]
  架构/论文类: [核心机制拆解, 工程上可落地的部分, 与本站已发内容的关联]

# ── 桥接探测 ────────────────────────────────────────────
# 借鉴 OpenBiliClaw 的破茧思路：主动往「相邻但本站没写过」的方向探测，
# 防止权重表只在已知圈子里打转。
#
# 命中 bridges 但不命中主 tags 的线索 → 加分并标注「探测项」。
# 你说方向对 → 升格进正式 tags；说不对 → 从这里删掉。
bridges:
  Agent 沙箱 / 运行时隔离: 3.0
  Skill 分发与市场: 3.0
  Agent 间通信协议: 2.5
  长任务状态持久化: 3.0
  端侧推理芯片: 2.5
  Agent 可观测性 / 追踪: 2.5
  合成数据生成: 2.0
  模型量化新方法: 2.5
  Agent 安全与越权防护: 2.5
  本地向量库 / 检索引擎: 2.0

# ── 逆热度加分 ──────────────────────────────────────────
# 同等匹配度下，star/粉丝少的加分。作者本人发的小项目常常比
# 被搬运十轮的热门更有价值，而热度排序天然埋没这类。
inverse_popularity:
  star_lt_50: 3.0
  star_50_500: 1.5
  star_gt_5000: -1.0    # 已经烂大街的，减分
