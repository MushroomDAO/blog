<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>forage 评审台</title>
<style>
:root{--bg:#faf9f7;--fg:#1a1a1a;--mut:#6b6b6b;--line:#e3e0da;--card:#fff;--acc:#c2410c;--ok:#2f8f5b}
@media(prefers-color-scheme:dark){:root{--bg:#16150f;--fg:#eceae4;--mut:#9a978f;--line:#2f2d26;--card:#1e1c16;--acc:#fb923c;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.62 -apple-system,"PingFang SC",system-ui,sans-serif;padding:1.5rem 1rem}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 .2rem}
.sub{color:var(--mut);font-size:.83rem;margin-bottom:1.1rem}
.bar{position:sticky;top:0;background:var(--bg);padding:.65rem 0;border-bottom:1px solid var(--line);margin-bottom:1rem;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;z-index:20}
button{font:inherit;font-size:.82rem;padding:.33rem .78rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--acc);color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.stat{color:var(--mut);font-size:.79rem;margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.95rem 1.1rem;margin-bottom:.8rem}
.card.write{border-left:4px solid var(--ok)}
.card.dig{border-left:4px solid var(--acc)}
.card.skip{opacity:.38}
.card.archive{border-left:4px solid var(--mut)}
.t{font-weight:600;font-size:1rem;margin-bottom:.25rem}
.meta{color:var(--mut);font-size:.78rem;margin:.25rem 0}
.tag{display:inline-block;font-size:.69rem;padding:.06rem .4rem;border:1px solid var(--line);border-radius:4px;margin-right:.28rem}
.pri{font-size:.74rem;margin:.35rem 0}
.pri i{font-style:normal;display:inline-block;margin-right:.5rem;padding:.05rem .4rem;border-radius:4px}
.pri i.y{background:rgba(47,143,91,.15);color:var(--ok)}
.pri i.n{background:rgba(194,65,12,.13);color:var(--acc)}
.core{font-size:.88rem;margin:.5rem 0;padding:.5rem .72rem;background:rgba(194,65,12,.06);border-radius:6px}
ul{margin:.3rem 0 .3rem 1rem;padding:0;font-size:.84rem}
.gap{font-size:.79rem;color:#b45309;margin-top:.35rem}
.acts{margin-top:.6rem;display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.acts input[type=text]{flex:1;min-width:12rem;font:inherit;font-size:.81rem;padding:.32rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
a{color:var(--acc)}
.saved{color:var(--ok);font-size:.74rem;opacity:0;transition:opacity .2s}
.saved.show{opacity:1}
</style></head><body><div class="wrap">
<h1>🍄 forage 评审台</h1>
<div class="sub">只做判断，不打分。决定和备注实时写入 SQLite，Claude 直接读库。</div>

<div class="bar">
  <button onclick="flt('all')" id="f-all" class="on">全部</button>
  <button onclick="flt('undecided')" id="f-undecided">未决定</button>
  <button onclick="flt('write')" id="f-write">已选写</button>
  <button onclick="flt('dig')" id="f-dig">要深挖</button>
  <span class="stat" id="stat"></span>
</div>
<div id="list"></div></div>

<script>
let ITEMS=[], CUR='all';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  const r = await fetch('/api/items').then(r=>r.json());
  ITEMS = r.items; render();
}

function render(){
  const L = document.getElementById('list'); L.innerHTML='';
  ITEMS.filter(d=>{
    if(CUR==='undecided') return !d.decision;
    if(CUR==='write')     return d.decision==='write';
    if(CUR==='dig')       return d.decision==='dig';
    return true;
  }).forEach(d=>{
    const c=document.createElement('div');
    c.className='card '+(d.decision||'');
    const R = d.research||{};
    let m=[];
    if(R.stars!=null) m.push('⭐'+R.stars);
    if(R.lic) m.push(R.lic);
    if(R.lang && R.lang!=='—') m.push(R.lang);
    if(R.pushed && R.pushed!=='—') m.push('提交 '+R.pushed);

    // 第一性原则的逐条判定，比任何分数都直观
    const P = R.principles || {};
    const priRow = Object.keys(P).length
      ? '<div class="pri">' + Object.entries(P).map(([k,v]) =>
          `<i class="${v?'y':'n'}">${v?'✓':'✗'} ${esc(k)}</i>`).join('') + '</div>'
      : '';

    c.innerHTML = `
      <div class="t">${esc(d.title)}</div>
      <div class="meta"><span class="tag">${esc(d.src)}</span>${m.join(' · ')}
        ${d.url?` · <a href="${esc(d.url)}" target="_blank">打开</a>`:''}</div>
      ${priRow}
      ${R.core?`<div class="core"><b>核心增量</b>：${esc(R.core)}</div>`
              :`<div class="core">⚠️ <b>未挖到核心增量</b> — 按规则本不该进清单</div>`}
      ${(R.angles||[]).length?'<ul>'+R.angles.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul>':''}
      ${R.gap?`<div class="gap">缺口：${esc(R.gap)}</div>`:''}
      <div class="acts">
        <button class="${d.decision==='write'?'on':''}"   onclick="decide('${d.id}','write')">写</button>
        <button class="${d.decision==='dig'?'on':''}"     onclick="decide('${d.id}','dig')">再挖</button>
        <button class="${d.decision==='archive'?'on':''}" onclick="decide('${d.id}','archive')">存档</button>
        <button class="${d.decision==='skip'?'on':''}"    onclick="decide('${d.id}','skip')">不要</button>
        <input type="text" placeholder="为什么？——这是我唯一能学到东西的地方"
               value="${esc(d.u_note||'')}" onchange="note('${d.id}',this.value)">
        <span class="saved" id="s-${d.id}">已存</span>
      </div>`;
    L.appendChild(c);
  });
  summary();
}

function flash(id){const e=document.getElementById('s-'+id);if(!e)return;
  e.classList.add('show');setTimeout(()=>e.classList.remove('show'),900);}

async function note(id,text){
  await fetch('/api/rate',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id,note:text})});
  const it=ITEMS.find(x=>x.id===id); if(it) it.u_note=text; flash(id);
}
async function decide(id,dec){
  const it=ITEMS.find(x=>x.id===id);
  const val = it.decision===dec ? '' : dec;
  await fetch('/api/decide',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id,decision:val})});
  it.decision=val; render();
}
function flt(f){CUR=f;['all','undecided','write','dig'].forEach(x=>
  document.getElementById('f-'+x).classList.toggle('on',x===f));render();}
async function summary(){
  const s = await fetch('/api/summary').then(r=>r.json());
  document.getElementById('stat').textContent =
    `共 ${s.total} · 写 ${s.write||0} · 再挖 ${s.dig||0} · 存档 ${s.archive||0} · 不要 ${s.skip||0} · 未决定 ${s.undecided||0}`;
}
load();
</script></body></html>
