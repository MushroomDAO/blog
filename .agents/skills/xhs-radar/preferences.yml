# ── 加分信号 ────────────────────────────────────────────
# 这些不是话题，是「这条线索值不值得深挖」的信号。
# 你的选题指纹是「开源 + 能本地跑 + 有部署路径和成本账」，
# 统计支持：标题里 开源 75 / 模型 53 / 指南 52 / 本地 45 / 完整 36 / 成本 9。
bonus:
  有 GitHub 仓库链接: 4.0
  有 HuggingFace 模型链接: 4.0
  明确开源协议: 2.5
  能本地/离线运行: 3.0
  Apple Silicon / Mac 可跑: 2.5
  给了部署步骤: 2.0
  给了硬件或成本数字: 2.5
  有 benchmark / 评测数据: 2.0
  首发或首次开源: 2.0

# ── 否决信号 ────────────────────────────────────────────
# 命中任意一条直接丢弃，不进清单。挡掉小红书上最多的那类噪音。
veto:
  - 纯付费课程 / 训练营招生
  - 无出处的截图搬运
  - 纯个人日常 vlog
  - 已在本站发过的同一仓库
  - 拉群 / 加微信 / 私域引流
  - 纯融资新闻无技术内容

# ── 阈值 ────────────────────────────────────────────────
# 打分后按这两条线分流。先松后紧：宁可多进清单让你划掉，
# 也不要漏掉。跑一周后按你的实际淘汰率再收紧。
thresholds:
  收进知识库: 12.0      # 存下来当弹药，不一定写
  进每日清单: 20.0      # 值得你花时间看一眼
  建议深挖成文: 30.0    # 直接去 GitHub/HF 拉一手资料

# ── 产出方向 ────────────────────────────────────────────
# 命中不同类型时，延展分析往哪个方向写。对应你说的两类文章。
angles:
  模型类: [部署步骤, 硬件选型与成本估算, 量化与显存实测, 同级别模型对比]
  工具/Skill类: [安装到跑通的完整路径, 适合谁用, 和现有工具的边界, 踩坑点]
  创业/商业类: [创业者怎么用, 适合哪个阶段, 成本结构, 可迁移到哪些行业]
  架构/论文类: [核心机制拆解, 工程上可落地的部分, 与本站已发内容的关联]
