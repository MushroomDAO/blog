name: CI Tests

# 不再自动部署到 Cloudflare Pages——部署改成本地 `./deploy.sh`（wrangler + 本地 token）手动
# 触发，理由见 docs/agent/followups.md FU-14：GitHub Actions 用的 CLOUDFLARE_API_TOKEN
# secret 曾经失效过、静默让好几次自动部署失败，没人第一时间发现。本地部署每次都是操作者
# 亲手确认过的一次真实执行，不依赖一个平时没人盯着的 GitHub secret 是否还有效。
# 这个 workflow 只负责在 push 时跑测试 + 确认构建通过，不碰 Cloudflare。
on:
  push:
    branches:
      - dailyblog
      - main
  # 修正（round 2 review 指出）：只在 push 上跑的话，这个仓库所有走 PR 流程的改动
  # 一次 CI 都不会跑到（包括这个 workflow 自己所在的这个 PR）。分支保护没配
  # required status checks，这个不挡任何人合并，但既然 CI 部署已经没了，这是仓库里
  # 最后一个自动信号，PR 阶段就该看到它，不必等合并后才知道测试/构建挂了。
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
