# Cloudflare Pages 配置
name = "blog-mushroom"
compatibility_date = "2024-01-01"
# 账号 id 不能写在这里——Pages 项目的配置 schema 不支持这个顶层字段（跟 Workers
# 项目不一样），写了会让每一次 `wrangler pages deploy` 都直接报错退出："Configuration
# file for Pages projects does not support 'account_id'"。这行从 chore/
# manual-deploy-only 合并起到现在的每一次部署都在静默失败，PR#56/#57 的改动一直
# 没有真正上线过，直到这次手动跑部署才发现。改成部署前导出 CLOUDFLARE_ACCOUNT_ID
# 环境变量——这是 wrangler 实际支持的方式；账号 id 唯一权威来源是项目 .env 的
# CLOUDFLARE_ACCOUNT_ID，deploy.sh / scripts/update-analytics.sh /
# pipeline/newsletter/local-fallback.sh 各自导出（.env 缺失时兜底用同一个字面量），
# publish.sh / publish-blog.sh / auto-publish.sh / scan-sources.sh 已经整体
# source .env，自动带上，不需要单独改。

# 构建输出目录（Pages 必需）
pages_build_output_dir = "./dist"

# T1.3.6 登录限速计数器，跟 T1.3.5 的索引 manifest 共用同一个 KV namespace
# （key 加 "ratelimit:" 前缀区分）。写进这里而不是只在 dashboard/API 配置，是因为
# `wrangler pages deploy` 每次部署都会用本文件的绑定声明覆盖项目当前配置——只在
# dashboard/API 加绑定、不写进这个文件，下一次部署就会被悄悄冲掉。
# BLOG_SEARCH_PASSWORD / BLOG_SEARCH_SESSION_SECRET 不放在这里：那两个是密文，
# 用 `wrangler pages secret put` 单独管理，不受这个文件的部署时绑定同步影响。
[[kv_namespaces]]
binding = "BLOG_SEARCH_KV"
id = "5af54057ca9646e8ac9c4ee600afa523"

# T1.3.3：/api/search 用来把 query 转成 embedding 的 Workers AI binding，同一个模型
# （bge-m3，1024 维）跟建索引时用的一致，否则查询向量和库里的向量不在同一个空间。
[ai]
binding = "AI"

# T1.3.3：/api/search 查询用的 Vectorize 索引，就是 T1.3.1 建的那个。
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "blog-search-v1"
